<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tradewinds · a crew of AI agents plans your escape</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css" />
<style>
@font-face { font-family: "Fraunces"; src: url(/static/vendor/fraunces-latin-opsz-normal.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Fraunces"; font-style: italic; src: url(/static/vendor/fraunces-latin-opsz-italic.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Manrope"; src: url(/static/vendor/manrope-latin-wght-normal.woff2) format("woff2"); font-weight: 200 800; }

:root {
  --sand: #f5eee3; --sand-2: #ece2d3; --paper: #fffaf3; --ink: #1d2a29; --muted: #6b7a76;
  --lagoon: #0e5a52; --lagoon-2: #157a6e; --sea: #cfe6e0; --coral: #f0704f; --sun: #f2b84b;
  --line: #e1d6c5; --radius: 18px;
  --shadow: 0 1px 0 rgba(29,42,41,.04), 0 10px 30px -18px rgba(29,42,41,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--sand); color: var(--ink); font: 15px/1.5 "Manrope", system-ui, sans-serif; }
button, textarea { font: inherit; color: inherit; }
.serif { font-family: "Fraunces", Georgia, serif; font-optical-sizing: auto; }

/* ---------- hero ---------- */
.hero { min-height: 100vh; display: grid; place-items: center; padding: 48px 20px; position: relative; overflow: hidden;
  background:
    radial-gradient(1200px 600px at 85% -10%, #fbd9a8 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 110%, #bfe2d8 0%, transparent 60%), var(--sand); }
.hero .sun { position: absolute; width: 340px; height: 340px; border-radius: 50%; right: -60px; top: -80px;
  background: radial-gradient(circle at 40% 40%, #ffd88a, #f5a65b 70%); opacity: .55; filter: blur(2px); }
.hero-inner { width: min(760px, 100%); position: relative; }
.eyebrow { text-transform: uppercase; letter-spacing: .16em; font-size: 12px; font-weight: 700; color: var(--lagoon); }
h1 { font-family: "Fraunces", serif; font-weight: 400; font-size: clamp(40px, 6.4vw, 76px); line-height: 1.02;
  letter-spacing: -.02em; margin: 14px 0 18px; }
h1 em { font-style: italic; color: var(--lagoon); }
.lede { color: var(--muted); font-size: 17px; max-width: 560px; margin: 0 0 28px; }
.composer { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; font-size: 18px; min-height: 96px; padding: 6px 8px; }
.composer-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.chip { border: 1px solid var(--line); background: rgba(255,250,243,.7); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-size: 13px; transition: .15s; }
.chip:hover { border-color: var(--lagoon); color: var(--lagoon); }
.btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; cursor: pointer; transition: .15s; }
.btn-primary { background: var(--lagoon); color: #fff; }
.btn-primary:hover { background: var(--lagoon-2); transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--lagoon); padding: 12px 8px; }
.mode { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sun); display: inline-block; }
.dot.live { background: #2bb673; }

/* ---------- app shell ---------- */
.app { display: none; }
.app.on { display: block; }
.topbar { position: sticky; top: 0; z-index: 1000; background: rgba(245,238,227,.86); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 16px; align-items: center; }
.brand { font-family: "Fraunces", serif; font-size: 22px; }
.brand b { color: var(--lagoon); font-weight: 500; }
.topbar .prompt { flex: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; font-family: "Fraunces", serif; }
.layout { display: grid; grid-template-columns: 360px 1fr; gap: 28px; padding: 24px; max-width: 1440px; margin: 0 auto; }
@media (max-width: 980px) { .layout { grid-template-columns: 1fr; } .crew-col { position: static !important; max-height: none !important; } }

/* ---------- crew column ---------- */
.crew-col { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 100px); display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel h3 { margin: 0; padding: 14px 16px 6px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.roster { padding: 4px 8px 10px; }
.member { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 12px; transition: .2s; }
.member .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; background: var(--sand-2); position: relative; }
.member .nm { font-weight: 700; font-size: 14px; }
.member .st { font-size: 12px; color: var(--muted); }
.member .tm { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.member.working { background: #eef6f3; }
.member.working .av::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--lagoon); border-right-color: transparent; animation: spin 1s linear infinite; }
.member.done .av { background: var(--sea); }
.member.bounced .av { background: #fde3da; }
@keyframes spin { to { transform: rotate(360deg); } }
.feed { overflow-y: auto; padding: 4px 12px 14px; flex: 1; min-height: 160px; scroll-behavior: smooth; }
.ev { font-size: 13px; padding: 6px 4px; border-bottom: 1px dashed var(--line); animation: rise .35s ease; }
.ev:last-child { border-bottom: 0; }
.ev .who { font-weight: 700; color: var(--lagoon); margin-right: 4px; }
.ev.thought { color: #3b4a47; font-style: italic; font-family: "Fraunces", serif; font-size: 14px; }
.ev .tool { display: inline-flex; gap: 6px; align-items: center; background: var(--sand-2); border-radius: 8px; padding: 2px 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.ev .res { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; padding-left: 10px; border-left: 2px solid var(--sea); }
.ev.revision { background: #fff1ea; border: 1px solid #f7c9b7; border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
.ev.revision b { color: var(--coral); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.usage { font-size: 12px; color: var(--muted); padding: 0 16px 12px; }

/* ---------- results ---------- */
.results { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.section { animation: rise .5s ease; }
.section-title { display: flex; align-items: baseline; gap: 12px; margin: 0 0 12px; }
.section-title h2 { font-family: "Fraunces", serif; font-weight: 400; font-size: 26px; margin: 0; letter-spacing: -.01em; }
.section-title span { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.placeholder { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 60px 24px; text-align: center; color: var(--muted); font-family: "Fraunces", serif; font-style: italic; font-size: 20px; }
.brief { padding: 18px 20px; display: grid; grid-template-columns: repeat(4, auto) 1fr; gap: 10px 32px; align-items: start; }
.brief .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.brief .v { font-weight: 700; font-size: 16px; }
.brief .tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: var(--sea); color: var(--lagoon); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
.tag.avoid { background: #fde3da; color: #b2492d; text-decoration: line-through; }
@media (max-width: 720px) { .brief { grid-template-columns: 1fr 1fr; } }

.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.opt { padding: 16px 16px 14px; position: relative; transition: .4s; }
.opt h4 { font-family: "Fraunces", serif; font-weight: 500; font-size: 21px; margin: 0; }
.opt .ctry { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.opt p { margin: 6px 0; font-size: 13.5px; }
.opt .wx { font-size: 13px; background: var(--sand); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
.opt .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
.opt.dim { opacity: .55; filter: saturate(.6); }
.opt.picked { border-color: var(--lagoon); box-shadow: 0 0 0 2px var(--lagoon), var(--shadow); }
.ribbon { position: absolute; top: 12px; right: 12px; background: var(--lagoon); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; }
.score { margin-top: 10px; display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: 66px 1fr 22px; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); }
.bar i { display: block; height: 6px; border-radius: 6px; background: var(--sea); overflow: hidden; }
.bar i b { display: block; height: 100%; background: var(--lagoon); width: 0; transition: width .8s ease; }
.verdict { margin-top: 12px; font-family: "Fraunces", serif; font-style: italic; font-size: 16px; color: #33433f; }

.trip-head { padding: 26px 26px 20px; background: linear-gradient(135deg, var(--lagoon), #13756a 60%, #2e8f79); color: #fff; border: 0; position: relative; overflow: hidden; }
.trip-head::after { content: ""; position: absolute; right: -40px; bottom: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(242,184,75,.55), transparent 70%); }
.trip-head .eyebrow { color: #bfe9de; }
.trip-head h2 { font-family: "Fraunces", serif; font-weight: 400; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.1; margin: 8px 0 14px; max-width: 820px; }
.hl { display: flex; flex-wrap: wrap; gap: 8px; position: relative; z-index: 1; }
.hl span { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.trip-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
@media (max-width: 1200px) { .trip-grid { grid-template-columns: 1fr; } .map-wrap { position: relative !important; top: 0 !important; } }
.map-wrap { position: sticky; top: 92px; align-self: start; }
#map { height: 560px; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); }
.leaflet-container { background: #b9dcd5; font: inherit; }
.pin { width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--coral); border: 3px solid #fff; box-shadow: 0 6px 14px rgba(0,0,0,.25); display: grid; place-items: center; }
.pin span { transform: rotate(45deg); color: #fff; font-weight: 800; font-size: 13px; }
.leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
.leaflet-popup-content b { font-family: "Fraunces", serif; font-size: 16px; font-weight: 500; }

.days { display: flex; flex-direction: column; gap: 10px; }
.base-h { display: flex; align-items: center; gap: 10px; margin: 8px 0 2px; font-family: "Fraunces", serif; font-size: 19px; }
.base-h .n { width: 26px; height: 26px; border-radius: 50%; background: var(--coral); color: #fff; font: 800 12px "Manrope"; display: grid; place-items: center; }
.base-h small { font: 12px "Manrope"; color: var(--muted); }
.day { padding: 14px 16px; cursor: pointer; transition: .2s; display: grid; grid-template-columns: 56px 1fr; gap: 14px; position: relative; }
.day:hover { transform: translateX(3px); border-color: var(--lagoon); }
.day.active { border-color: var(--lagoon); box-shadow: 0 0 0 2px var(--lagoon), var(--shadow); }
.day .num { text-align: center; }
.day .num b { display: block; font-family: "Fraunces", serif; font-size: 30px; font-weight: 400; line-height: 1; }
.day .num small { display: block; margin-top: 4px; line-height: 1.35; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.day h5 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.pace { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; }
.pace.slow { background: var(--sea); color: var(--lagoon); }
.pace.easy { background: #fbecc7; color: #8a6514; }
.pace.active { background: #fde3da; color: #b2492d; }
.slots { display: grid; gap: 3px; font-size: 13.5px; color: #34433f; }
.slots div { display: grid; grid-template-columns: 22px 1fr; }
.revised { position: absolute; top: 12px; right: 12px; background: var(--coral); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; animation: rise .4s; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.card-pad { padding: 18px 20px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.row:last-child { border-bottom: 0; }
.row .muted { color: var(--muted); font-size: 12.5px; }
.stack { display: flex; height: 16px; border-radius: 10px; overflow: hidden; margin: 6px 0 14px; }
.stack i { display: block; height: 100%; transition: flex-grow .8s; }
.legend { display: grid; gap: 6px; }
.legend div { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.legend s { width: 12px; height: 12px; border-radius: 4px; display: block; }
.total { display: flex; align-items: baseline; justify-content: space-between; margin-top: 12px; }
.total b { font-family: "Fraunces", serif; font-size: 34px; font-weight: 400; }
.ok { color: #1d8f5a; font-weight: 800; font-size: 13px; }
.over { color: var(--coral); font-weight: 800; font-size: 13px; }
.pack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pack span { background: var(--sand); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.stamp { display: flex; gap: 18px; align-items: center; padding: 18px 22px; }
.stamp .seal { width: 64px; height: 64px; flex: none; border-radius: 50%; border: 3px solid #1d8f5a; color: #1d8f5a; display: grid; place-items: center; font-size: 28px; transform: rotate(-8deg); }
.stamp p { margin: 2px 0 0; color: #34433f; }
.footer-note { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0 30px; }
.err { background: #fde3da; color: #8a2e17; border-radius: 12px; padding: 12px 14px; }
</style>
</head>
<body>

<!-- ======================= HERO ======================= -->
<section class="hero" id="hero">
  <div class="sun"></div>
  <div class="hero-inner">
    <div class="eyebrow">Tradewinds · seven AI agents, one escape</div>
    <h1>Tell us how you <em>feel</em>.<br/>We'll find where to go.</h1>
    <p class="lede">A scout, a judge, an itinerary builder, a logistics planner, an accountant and a picky reviewer work through your trip together. You can watch them do it live.</p>
    <div class="composer">
      <textarea id="prompt" rows="3" placeholder="Two weeks from Dec 1, burnt out, want somewhere warm and slow…"></textarea>
      <div class="composer-row">
        <div class="mode" id="mode"><span class="dot"></span> checking…</div>
        <div>
          <button class="btn btn-ghost" id="demoBtn">Watch a sample run</button>
          <button class="btn btn-primary" id="goBtn">Plan my escape →</button>
        </div>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</section>

<!-- ======================= APP ======================= -->
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">Trade<b>winds</b></div>
    <div class="prompt" id="topPrompt"></div>
    <button class="btn btn-ghost" id="newBtn">New trip</button>
  </header>
  <div class="layout">
    <aside class="crew-col">
      <div class="panel"><h3>The crew</h3><div class="roster" id="roster"></div></div>
      <div class="panel" style="display:flex;flex-direction:column;min-height:0;flex:1">
        <h3>Live activity</h3>
        <div class="feed" id="feed"></div>
        <div class="usage" id="usage"></div>
      </div>
    </aside>
    <main class="results" id="results"></main>
  </div>
</div>

<script src="/static/vendor/leaflet.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AGENTS = {
  brief:     { icon: "📝", label: "Trip Brief",        idle: "Reads your mood" },
  scout:     { icon: "🧭", label: "Destination Scout", idle: "Finds candidate places" },
  judge:     { icon: "⚖️", label: "Vibe Judge",        idle: "Scores and picks one" },
  itinerary: { icon: "🗺️", label: "Itinerary Builder", idle: "Plans each day" },
  logistics: { icon: "✈️", label: "Logistics",         idle: "Flights and stays" },
  budget:    { icon: "💵", label: "Budget",            idle: "Keeps you honest" },
  reviewer:  { icon: "🔍", label: "Reviewer",          idle: "Checks the plan" },
};
const EXAMPLES = [
  "Two weeks from Dec 1, burnt out, want chill + tropical, learn to surf, great food, no party scene. From Boston, ~$3k.",
  "10 days in January, remote-work friendly beach town with fast wifi, from NYC, $2,500.",
  "A week in February, snorkeling and street food, very cheap, from SF.",
  "Long weekend, warm, from Boston, no more than 4 hours of flying.",
];
const PALETTE = ["#0e5a52", "#2e8f79", "#f2b84b", "#f0704f", "#9cc9bd", "#d9c4a3", "#7a8c87"];
let es = null, map = null, markers = {}, startTimes = {}, lastItin = null, liveMode = false;

// --------------------------------------------------------- hero
EXAMPLES.forEach(t => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = t.length > 58 ? t.slice(0, 56) + "…" : t;
  b.onclick = () => { $("#prompt").value = t; $("#prompt").focus(); };
  $("#chips").appendChild(b);
});
$("#prompt").value = EXAMPLES[0];
fetch("/api/health").then(r => r.json()).then(h => {
  liveMode = h.live;
  $("#mode").innerHTML = h.live ? '<span class="dot live"></span> Live agents' : '<span class="dot"></span> Demo mode (sample run)';
}).catch(() => { $("#mode").textContent = "offline"; });
$("#goBtn").onclick = () => start($("#prompt").value.trim(), !liveMode);
$("#demoBtn").onclick = () => start(EXAMPLES[0], true);
$("#newBtn").onclick = () => { es && es.close(); $("#app").classList.remove("on"); $("#hero").style.display = ""; };

// --------------------------------------------------------- run
function start(prompt, demo) {
  if (!prompt) return;
  es && es.close();
  $("#hero").style.display = "none"; $("#app").classList.add("on");
  $("#topPrompt").textContent = "“" + prompt + "”";
  $("#feed").innerHTML = ""; $("#usage").textContent = ""; lastItin = null; startTimes = {};
  $("#results").innerHTML = '<div class="placeholder" id="ph">The crew is getting to work…</div>';
  if (map) { map.remove(); map = null; }
  renderRoster(Object.keys(AGENTS));
  window.scrollTo(0, 0);
  const qs = new URLSearchParams({ prompt }); if (demo) qs.set("demo", "1");
  es = new EventSource("/api/plan?" + qs);
  es.onmessage = m => handle(JSON.parse(m.data));
  es.onerror = () => { es.close(); };
}

function handle(ev) {
  const a = ev.agent;
  switch (ev.type) {
    case "run_start": renderRoster(ev.agents.map(x => x.name)); break;
    case "agent_start":
      startTimes[a] = performance.now();
      setMember(a, "working", "Working…");
      feed(`<span class="who">${AGENTS[a].icon} ${AGENTS[a].label}</span> started`);
      break;
    case "thought": feed(`<span class="who">${AGENTS[a].icon}</span>${esc(ev.text)}`, "thought"); break;
    case "tool_call": {
      const arg = Object.values(ev.input).slice(0, 2).map(v => typeof v === "number" ? v.toFixed(2) : v).join(", ");
      feed(`<span class="who">${AGENTS[a].icon}</span><span class="tool">⚙ ${esc(ev.tool)}(${esc(arg)})</span>`, "", `${a}-${ev.tool}`);
      break; }
    case "tool_result": attachResult(a, ev.tool, ev.result); break;
    case "agent_done":
      setMember(a, "done", "Done", ev.seconds);
      onOutput(a, ev.output);
      break;
    case "revision":
      setMember("reviewer", "bounced", `Sent back (round ${ev.round})`);
      feed(`<b>↺ Reviewer sent it back</b><br>${ev.issues.map(esc).join("<br>")}`, "revision");
      break;
    case "final":
      onFinal(ev);
      es.close();
      break;
    case "error": case "agent_error":
      feed(`<div class="err">⚠ ${esc(ev.message)}</div>`); es.close(); break;
  }
}

// --------------------------------------------------------- crew panel
function renderRoster(names) {
  $("#roster").innerHTML = names.map(n => `
    <div class="member" id="m-${n}">
      <div class="av">${AGENTS[n].icon}</div>
      <div><div class="nm">${AGENTS[n].label}</div><div class="st">${AGENTS[n].idle}</div></div>
      <div class="tm"></div>
    </div>`).join("");
}
function setMember(n, cls, status, secs) {
  const el = $("#m-" + n); if (!el) return;
  el.className = "member " + cls;
  $(".st", el).textContent = status;
  if (secs != null) $(".tm", el).textContent = secs + "s";
}
function feed(html, cls = "", key) {
  const d = document.createElement("div");
  d.className = "ev " + cls; d.innerHTML = html; if (key) d.dataset.key = key;
  $("#feed").appendChild(d); $("#feed").scrollTop = 1e9;
}
function attachResult(agent, tool, r) {
  const els = [...document.querySelectorAll(`.ev[data-key="${agent}-${tool}"]`)].filter(e => !e.dataset.done);
  const el = els[0]; if (!el) return;
  el.dataset.done = 1;
  let s;
  if (r.error) s = "⚠ " + r.error;
  else if (tool === "geocode") s = r.matches.slice(0, 1).map(m => `${m.name}, ${m.country} · ${m.lat}, ${m.lon}`).join("");
  else if (tool === "climate_for_window") s = `☀ ${r.avg_high_c}° / ${r.avg_low_c}° · ${r.rainy_days} of ${r.total_days} days rainy · ${r.avg_sunshine_hours}h sun`;
  else if (tool === "ocean_conditions") s = `🌊 ~${r.avg_max_wave_m} m waves @ ${r.avg_period_s}s`;
  else s = JSON.stringify(r).slice(0, 120);
  el.insertAdjacentHTML("beforeend", `<span class="res">${esc(s)}</span>`);
}

// --------------------------------------------------------- results
function section(id, title, sub, html) {
  $("#ph")?.remove();
  let s = $("#s-" + id);
  if (!s) { s = document.createElement("section"); s.className = "section"; s.id = "s-" + id; $("#results").appendChild(s); }
  s.innerHTML = (title ? `<div class="section-title"><h2>${title}</h2><span>${sub || ""}</span></div>` : "") + html;
  return s;
}
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const dow = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" });
const md = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const money = n => "$" + Number(n).toLocaleString();

function onOutput(agent, o) {
  if (agent === "brief") {
    section("brief", "The brief", "what we heard", `<div class="panel brief">
      <div><div class="k">When</div><div class="v">${fmtDate(o.start_date)} – ${fmtDate(o.end_date)}</div></div>
      <div><div class="k">Nights</div><div class="v">${o.nights}</div></div>
      <div><div class="k">From</div><div class="v">${esc(o.origin)}</div></div>
      <div><div class="k">Budget</div><div class="v">${money(o.budget_usd)}</div></div>
      <div><div class="k">Style</div><div class="v" style="font-weight:500;font-size:14px">${esc(o.travel_style)}</div></div>
      <div class="tags">${o.vibe.map(v => `<span class="tag">${esc(v)}</span>`).join("")}${o.must_haves.map(v => `<span class="tag" style="background:#fbecc7;color:#8a6514">★ ${esc(v)}</span>`).join("")}${o.avoid.map(v => `<span class="tag avoid">${esc(v)}</span>`).join("")}</div>
    </div>`);
  }
  if (agent === "scout") {
    section("options", "Where you could go", `${o.options.length} options scouted`,
      `<div class="options">${o.options.map((x, i) => `
        <div class="panel opt" data-name="${esc(x.name)}">
          <h4>${esc(x.name)}</h4><div class="ctry">${esc(x.country)} · ✈ ~${x.est_flight_hours}h</div>
          <p>${esc(x.why)}</p>
          <div class="wx">☀ ${esc(x.weather_summary)}</div>
          <div class="meta">Tradeoff: ${esc(x.tradeoffs)}</div>
          <div class="score"></div>
        </div>`).join("")}</div><div class="verdict" id="verdict"></div>`);
  }
  if (agent === "judge") {
    document.querySelectorAll(".opt").forEach(card => {
      const sc = o.scores.find(s => s.name.toLowerCase() === card.dataset.name.toLowerCase());
      const picked = card.dataset.name.toLowerCase() === o.pick.toLowerCase();
      card.classList.add(picked ? "picked" : "dim");
      if (picked) card.insertAdjacentHTML("afterbegin", `<div class="ribbon">The pick</div>`);
      if (sc) {
        $(".score", card).innerHTML = [["vibe", sc.vibe_fit], ["weather", sc.weather], ["budget", sc.budget_fit], ["ease", sc.ease]]
          .map(([k, v]) => `<div class="bar">${k}<i><b data-w="${v * 10}"></b></i>${v}</div>`).join("") +
          `<div class="bar" style="color:var(--ink);font-weight:800">total<span></span>${sc.total}</div>`;
      }
    });
    requestAnimationFrame(() => document.querySelectorAll(".bar b").forEach(b => b.style.width = b.dataset.w + "%"));
    $("#verdict").textContent = "⚖ " + o.reasoning;
    setTimeout(() => $("#s-options").scrollIntoView({ behavior: "smooth", block: "start" }), 50);
  }
  if (agent === "itinerary") renderItinerary(o);
  if (agent === "logistics") { window._log = o; renderLogistics(); }
  if (agent === "budget") renderBudget(o);
}

function renderItinerary(it) {
  const prev = lastItin; lastItin = it;
  const changed = new Set();
  if (prev) it.days.forEach((d, i) => { if (JSON.stringify(d) !== JSON.stringify(prev.days[i])) changed.add(d.day); });

  // group consecutive days by base
  const groups = [];
  it.days.forEach(d => { const g = groups[groups.length - 1]; if (g && g.base === d.base) g.days.push(d); else groups.push({ base: d.base, lat: d.lat, lon: d.lon, days: [d] }); });

  const s = section("trip", "", "", `
    <div class="panel trip-head">
      <div class="eyebrow">Your escape · ${it.days.length} days · ${groups.length} bases</div>
      <h2>${esc(it.headline)}</h2>
      <div class="hl">${it.highlights.map(h => `<span>✦ ${esc(h)}</span>`).join("")}</div>
    </div>
    <div class="trip-grid">
      <div class="days">${groups.map((g, gi) => `
        <div class="base-h"><span class="n">${gi + 1}</span>${esc(g.base)} <small>${g.days.length} day${g.days.length > 1 ? "s" : ""}</small></div>
        ${g.days.map(d => `
          <div class="panel day" data-day="${d.day}" data-base="${esc(d.base)}">
            ${changed.has(d.day) ? '<div class="revised">Revised</div>' : ""}
            <div class="num"><b>${d.day}</b><small>${dow(d.date)}<br>${md(d.date)}</small></div>
            <div>
              <h5>${esc(d.title)} <span class="pace ${esc(d.pace)}">${esc(d.pace)}</span></h5>
              <div class="slots">
                <div><span>🌅</span><span>${esc(d.morning)}</span></div>
                <div><span>☀️</span><span>${esc(d.afternoon)}</span></div>
                <div><span>🌙</span><span>${esc(d.evening)}</span></div>
              </div>
            </div>
          </div>`).join("")}`).join("")}
      </div>
      <div class="map-wrap"><div id="map"></div></div>
    </div>`);

  // map
  if (map) map.remove();
  map = L.map("map", { scrollWheelZoom: false, zoomControl: true });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO', subdomains: "abcd", maxZoom: 18 }).addTo(map);
  markers = {};
  const pts = groups.map(g => [g.lat, g.lon]);
  L.polyline(pts, { color: "#0e5a52", weight: 3, dashArray: "6 8", opacity: .85 }).addTo(map);
  groups.forEach((g, gi) => {
    const icon = L.divIcon({ className: "", html: `<div class="pin"><span>${gi + 1}</span></div>`, iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -30] });
    const range = g.days.length > 1 ? `Days ${g.days[0].day}–${g.days[g.days.length - 1].day}` : `Day ${g.days[0].day}`;
    markers[g.base] = L.marker([g.lat, g.lon], { icon }).addTo(map)
      .bindPopup(`<b>${esc(g.base)}</b><br>${range}<br><span style="color:#6b7a76">${g.days.map(d => esc(d.title)).join(" · ")}</span>`);
  });
  map.fitBounds(L.latLngBounds(pts).pad(0.45));
  setTimeout(() => map.invalidateSize(), 60);

  s.querySelectorAll(".day").forEach(card => card.onclick = () => {
    s.querySelectorAll(".day").forEach(c => c.classList.remove("active"));
    card.classList.add("active");
    const m = markers[card.dataset.base];
    if (m) { map.flyTo(m.getLatLng(), 11, { duration: .8 }); m.openPopup(); }
  });
  if (changed.size) setTimeout(() => s.querySelector(".revised")?.closest(".day").scrollIntoView({ behavior: "smooth", block: "center" }), 80);
  // keep logistics/budget below the trip
  ["logistics", "review"].forEach(id => { const el = $("#s-" + id); el && $("#results").appendChild(el); });
}

function renderLogistics(budget) {
  const o = window._log; if (!o) return;
  budget = budget || window._budget;
  const s = section("logistics", "Getting there &amp; paying for it", "logistics · budget", `
    <div class="two">
      <div class="panel card-pad">
        <div class="row"><div><b>✈ ${esc(o.flights.route)}</b><div class="muted">${esc(o.flights.notes)}</div></div><b>${money(o.flights.est_round_trip_usd)}</b></div>
        ${o.stays.map(st => `<div class="row"><div><b>🏡 ${esc(st.base)}</b> · ${st.nights} nights<div class="muted">${esc(st.kind)}</div></div><div>${money(st.est_per_night_usd)}<span class="muted">/night</span></div></div>`).join("")}
        <div class="row"><div><b>🚐 Getting around</b><div class="muted">${esc(o.getting_around)}</div></div></div>
        <div class="pack">${o.packing.map(p => `<span>${esc(p)}</span>`).join("")}</div>
      </div>
      <div class="panel card-pad" id="budgetCard">${budget ? budgetHTML(budget) : '<div class="muted" style="color:var(--muted)">Budget agent is adding it up…</div>'}</div>
    </div>`);
  const rev = $("#s-review"); rev && $("#results").appendChild(rev);
  if (budget) requestAnimationFrame(() => s.querySelectorAll(".stack i").forEach(i => i.style.flexGrow = i.dataset.g));
}
function budgetHTML(b) {
  return `<div class="stack">${b.lines.map((l, i) => `<i style="background:${PALETTE[i % PALETTE.length]};flex-grow:0" data-g="${l.usd}"></i>`).join("")}</div>
    <div class="legend">${b.lines.map((l, i) => `<div><s style="background:${PALETTE[i % PALETTE.length]}"></s>${esc(l.category)}<b>${money(l.usd)}</b></div>`).join("")}</div>
    <div class="total"><b>${money(b.total_usd)}</b><span class="${b.within_budget ? "ok" : "over"}">${b.within_budget ? "✓ Within budget" : "Over budget"}</span></div>
    <div style="color:var(--muted);font-size:13px;margin-top:4px">${esc(b.notes)}</div>`;
}
function renderBudget(b) { window._budget = b; renderLogistics(b); }

function onFinal(ev) {
  const r = ev.trip.review;
  section("review", "", "", `<div class="panel stamp">
    <div class="seal">${r.approved ? "✓" : "!"}</div>
    <div><b>${r.approved ? "Approved by the Reviewer" : "Shipped with open issues"}</b><p>${esc(r.summary)}</p></div>
  </div><div class="footer-note">Prices are agent estimates. Weather comes from Open-Meteo historical data for your dates. Built with the Anthropic API and seven tool-using agents.</div>`);
  if (ev.usage) $("#usage").textContent = `${(ev.usage.input_tokens + ev.usage.output_tokens).toLocaleString()} tokens across the crew`;
  feed(`<span class="who">✦</span> Trip ready. Bon voyage.`);
}
</script>
</body>
</html>
